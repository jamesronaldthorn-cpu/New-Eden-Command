name: Build New Eden Command Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer, onedir update and feed
        shell: pwsh
        env:
          EVE_SSO_CLIENT_ID: ${{ vars.EVE_SSO_CLIENT_ID }}
          EVE_SSO_REDIRECT_URI: ${{ vars.EVE_SSO_REDIRECT_URI }}
        run: |
          if (-not $env:EVE_SSO_CLIENT_ID) { throw 'Set the repository Actions variable EVE_SSO_CLIENT_ID before building a public release.' }
          .\build_release.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: new-eden-command-windows
          path: releases/*

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*
